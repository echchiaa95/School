
name: Build and Deploy Smart School

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Verify deployment files
        shell: bash
        run: |
          set -e

          test -f dist/admin.html || {
            echo "ERROR: admin.html missing from dist"
            exit 1
          }

          test -d dist/assets || {
            echo "ERROR: assets folder missing from dist"
            exit 1
          }

          echo "Checking admin JavaScript bundle..."

          grep -oE 'src="[^"]+\.js[^"]*"' dist/admin.html

          echo "Checking all generated files..."
          find dist -type f | sort

          echo "Deployment files verified successfully."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
