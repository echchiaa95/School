
name: Deploy School Management

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Configure GitHub Pages
      # ============================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 3. Find and extract project ZIP
      # ============================================================
      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          echo "Searching for project ZIP files..."

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 2 -type f -iname "*.zip" \
              ! -path "./.git/*" | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found:"
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "Keep only the intended project ZIP in the repository."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Selected ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

      # ============================================================
      # 4. Locate index.html
      # ============================================================
      - name: Locate website
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t INDEX_FILES < <(
            find extracted -type f -name "index.html" | sort
          )

          if [ "${#INDEX_FILES[@]}" -eq 0 ]; then
            echo "ERROR: index.html not found inside ZIP."
            exit 1
          fi

          if [ "${#INDEX_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple index.html files found:"
            printf '%s\n' "${INDEX_FILES[@]}"
            echo "Please ensure the ZIP contains one website root."
            exit 1
          fi

          SOURCE="$(dirname "${INDEX_FILES[0]}")"

          echo "Website source: $SOURCE"

          echo "$SOURCE" > website_source.txt

      # ============================================================
      # 5. Prepare website
      # ============================================================
      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          SOURCE="$(cat website_source.txt)"

          cp -a "$SOURCE"/. public/

          test -s public/index.html

          echo "Website prepared successfully."

          echo "Published files:"
          find public -maxdepth 3 -type f | sort | head -n 150

      # ============================================================
      # 6. Verify website
      # ============================================================
      - name: Verify website
        shell: bash
        run: |
          set -euo pipefail

          test -s public/index.html

          echo "OK: index.html"

          for FILE in \
            "modules/auth.js" \
            "modules/supabase.js"
          do
            if [ -f "public/$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "WARNING: $FILE not found"
            fi
          done

          echo "Website verification completed."

      # ============================================================
      # 7. Upload GitHub Pages artifact
      # ============================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public
          retention-days: 1

      # ============================================================
      # 8. Deploy to GitHub Pages
      # ============================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
