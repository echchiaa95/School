
name: Deploy School Management

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Find the correct ZIP by checking its contents
      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          echo "Searching ZIP archives..."

          SELECTED_ZIP=""

          # Optional: set an exact ZIP path here if needed.
          PROJECT_ZIP=""

          if [ -n "$PROJECT_ZIP" ]; then
            if [ ! -f "$PROJECT_ZIP" ]; then
              echo "ERROR: Configured ZIP does not exist: $PROJECT_ZIP"
              exit 1
            fi
            SELECTED_ZIP="$PROJECT_ZIP"
          else
            while IFS= read -r -d '' ZIP; do
              echo "Checking: $ZIP"

              if unzip -Z1 "$ZIP" | grep -Eiq '(^|/)index\.html$'; then
                if [ -n "$SELECTED_ZIP" ]; then
                  echo "ERROR: More than one ZIP contains index.html."
                  echo "First: $SELECTED_ZIP"
                  echo "Another: $ZIP"
                  echo "Set PROJECT_ZIP explicitly in this step."
                  exit 1
                fi

                SELECTED_ZIP="$ZIP"
              fi
            done < <(
              find . -type f -iname "*.zip" \
                -not -path "./.git/*" -print0 | sort -z
            )
          fi

          if [ -z "$SELECTED_ZIP" ]; then
            echo "ERROR: No ZIP containing index.html was found."
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Selected project ZIP: $SELECTED_ZIP"

          unzip -o "$SELECTED_ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -n 150

      # Locate the actual website directory
      - name: Locate website
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for index.html..."

          mapfile -t INDEX_FILES < <(
            find extracted -type f -name "index.html" | sort
          )

          if [ "${#INDEX_FILES[@]}" -eq 0 ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          if [ "${#INDEX_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple index.html files found:"
            printf '%s\n' "${INDEX_FILES[@]}"
            echo "Cannot safely determine the website root."
            exit 1
          fi

          INDEX_FILE="${INDEX_FILES[0]}"
          SOURCE="$(dirname "$INDEX_FILE")"

          echo "Website entry point: $INDEX_FILE"
          echo "Website source: $SOURCE"

          echo "$SOURCE" > website_source.txt

      # Prepare GitHub Pages directory
      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          SOURCE="$(cat website_source.txt)"

          echo "Publishing from: $SOURCE"

          cp -a "$SOURCE"/. public/

          echo "Published files:"
          find public -maxdepth 3 -type f | head -n 150

      # Verify the deployed website
      - name: Verify website
        shell: bash
        run: |
          set -euo pipefail

          test -s public/index.html

          echo "OK: index.html"

          for FILE in \
            "modules/auth.js" \
            "modules/supabase.js"
          do
            if [ -f "public/$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "NOTICE: $FILE not found"
            fi
          done

          echo "Website verification completed."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
